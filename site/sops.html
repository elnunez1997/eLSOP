<script>
function toggleTheme() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  localStorage.setItem('theme', isDark ? 'light' : 'dark');
}
(function() {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
})();
</script>

<script>
const SOPS = [
  { name: "ADUSA Distribution / Giant / Stop & Shop", file: "ADUSA_Distr_The_Giant_Company_Giant_Foods_Stop_Shop.docx" },
  { name: "Associated Supermarket Group (ASG)",        file: "Associated_Supermarket_Group.docx" },
  { name: "Brookshire Grocery Company",                file: "Brookshire_Grocery_Company.docx" },
  { name: "Delhaize",                                  file: "Delhaize.docx" },
  { name: "Demoulas Supermarkets Inc",                 file: "Demoulas_Supermarkets_Inc.docx" },
  { name: "General Trading",                           file: "General_Trading.docx" },
  { name: "Golub Corporation (Price Chopper)",         file: "Golub_Corporation.docx" },
  { name: "Harris Teeter Supermarkets",                file: "Harris_Teeter_Supermarkets.docx" },
  { name: "HyVee Corporate / Lomar / PDI",             file: "HyVee_Corporate_Lomar_Perishable_Dist_of_Iowa_PDI.docx" },
  { name: "K-V-A-T Food Store Inc (Food City)",        file: "K_V_A_T_Food_Store_Inc.docx" },
  { name: "Kroger / Ralphs / Jake's / Vitacost",       file: "Kroger_Ralphs_Grocery_Company_Jakes_Finer_Foods_Vitacostcom.docx" },
  { name: "McLane Company Inc",                        file: "McLane_Company_Inc.docx" },
  { name: "Mitchell Grocery Company",                  file: "Mitchell_Grocery_Company.docx" },
  { name: "OK Grocery Co / Giant Eagle",               file: "OK_Grocery_Co_Giant_Eagle.docx" },
  { name: "Save Mart / Yosemite / Food Maxx",          file: "Save_Mart_Yosemite_Save_Mart_Food_Maxx.docx" },
  { name: "Schnucks Markets Inc",                      file: "Schnucks_Markets_Inc.docx" },
  { name: "Smart and Final",                           file: "Smart_and_Final.docx" },
  { name: "Stater Bros",                               file: "Stater_Bros.doc" },
  { name: "UNFI Conventional (SuperValu)",             file: "UNFI_Conventional.docx" },
  { name: "United Natural Foods West / UNFI AP",       file: "United_Natural_Foods_West_UNFI_Accounts_Payable.docx" },
  { name: "WinCo Foods Inc",                           file: "Winco_Foods_Inc.docx" }
];

// Group by first letter
const groups = {};
SOPS.forEach(s => {
  const letter = s.name[0].toUpperCase();
  if (!groups[letter]) groups[letter] = [];
  groups[letter].push(s);
});

const container = document.getElementById("sopContainer");
Object.keys(groups).sort().forEach(letter => {
  const section = document.createElement("div");
  section.className = "alpha-section";
  section.innerHTML = `
    <div class="alpha-header"><span>${letter}</span></div>
    <div class="sop-grid">${
      groups[letter].map(s => `
        <div class="sop-card">
          <div class="sop-card-icon">📄</div>
          <div class="sop-card-name">${s.name}</div>
          <a class="sop-card-link" href="sops/${s.file}" download>Download</a>
        </div>`).join("")
    }</div>`;
  container.appendChild(section);
});
</script>
</body>
